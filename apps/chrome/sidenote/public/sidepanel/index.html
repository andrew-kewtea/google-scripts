<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sidenote</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <p class="mark">sidenote</p>
      <h1>Page</h1>
      <p id="page-title" class="muted">No active tab</p>
      <p id="page-url" class="url"></p>
    </header>

    <section>
      <label for="collection">Collection</label>
      <input id="collection" type="text" value="My Collections" />
      <label for="body">Note</label>
      <textarea id="body" rows="6" placeholder="Jot down on the side"></textarea>
      <div class="row">
        <button id="capture" type="button">Capture selection</button>
        <button id="save" type="button">Save local</button>
      </div>
      <p id="status" class="status" role="status"></p>
    </section>

    <section>
      <h2>Local notes</h2>
      <ul id="notes"></ul>
    </section>
    <script type="module" src="./main.js"></script>
  </body>
</html>
